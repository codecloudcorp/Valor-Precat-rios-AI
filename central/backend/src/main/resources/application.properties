spring.application.name=backend
server.port=${PORT:8080}

# Origens permitidas (CORS)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://valorprecatorio.adv.br,https://www.valorprecatorio.adv.br,https://valor-precat-rios-ai.vercel.app,http://localhost:3000}

# --- CONFIGURAÇÃO DE ELITE GMAIL (Porta 465) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtps

# Força configurações tanto para SMTP quanto SMTPS (Blindagem)
spring.mail.properties.mail.transport.protocol=smtps

# Configurações para o protocolo 'smtps'
spring.mail.properties.mail.smtps.auth=true
spring.mail.properties.mail.smtps.ssl.enable=true
spring.mail.properties.mail.smtps.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtps.timeout=5000
spring.mail.properties.mail.smtps.connectiontimeout=5000

# Configurações de fallback para 'smtp' (caso o Spring decida trocar)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Configuração do Gemini e Destinatário
app.mail.destinatario=${MAIL_DESTINO:sachabm@gmail.com}
gemini.api.key=${GEMINI_API_KEY}

logging.level.org.springframework.web=INFO