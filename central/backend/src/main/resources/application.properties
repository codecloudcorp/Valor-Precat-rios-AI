spring.application.name=backend

# Configuração do Servidor (NÃO MEXA, ISSO ESTÁ CERTO)
server.port=${PORT:8080}

# Lista de origens permitidas (separadas por vírgula, SEM ESPAÇOS e SEM BARRA NO FINAL)
cors.allowed.origins=http://localhost:3000,http://localhost:8080

# Chave da API do Google Gemini (Lê a variável GEMINI_API_KEY do Railway)
gemini.api.key=${GEMINI_API_KEY}

# Configurações de Log
logging.level.org.springframework.web=INFO

# Configurações do Servidor de E-mail (Porta 465 SSL)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Remova ou mude para 'smtp' se você tinha colocado 'JavaMailSender'
spring.mail.protocol=smtp

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Propriedades adicionais para evitar o erro de provedor
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.debug=true