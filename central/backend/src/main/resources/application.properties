spring.application.name=backend

# Configuração do Servidor
server.port=${PORT:8080}

# Origens permitidas (CORS)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# Configurações de E-mail (Porta 587 STARTTLS - A mais compatível com Cloud)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp

# Propriedades de Handshake e Segurança
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Timeouts agressivos para evitar que a conexão morra silenciosamente
spring.mail.properties.mail.smtp.connectiontimeout=20000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000

# Força o uso de IPv4 (Essencial no Railway para evitar timeout no handshake)
spring.mail.properties.mail.smtp.localhost=127.0.0.1

# Configuração do Destinatário e Gemini
app.mail.destinatario=${MAIL_DESTINO:sachabm@gmail.com}
gemini.api.key=${GEMINI_API_KEY}
logging.level.org.springframework.web=INFO