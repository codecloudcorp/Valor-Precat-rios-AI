spring.application.name=backend
server.port=${PORT:8080}

# Origens permitidas (CORS)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://valorprecatorio.adv.br,https://www.valorprecatorio.adv.br,https://valor-precat-rios-ai.vercel.app,http://localhost:3000}

# Configurações de E-mail (Gmail via SSL/TLS Forçado)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Propriedades de Socket (Tentativa de ignorar bloqueio local)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Timeouts curtos para não derrubar o frontend
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Destinatário e Gemini
app.mail.destinatario=${MAIL_DESTINO:sachabm@gmail.com}
gemini.api.key=${GEMINI_API_KEY}

logging.level.org.springframework.web=INFO