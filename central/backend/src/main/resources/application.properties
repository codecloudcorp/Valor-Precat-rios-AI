spring.application.name=backend

# Configuração do Servidor para Railway
server.port=${PORT:8080}

# Origens permitidas (CORS)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://valorprecatorio.adv.br,https://www.valorprecatorio.adv.br,https://valor-precat-rios-ai.vercel.app,http://localhost:3000}

# Configurações de E-mail (Obrigatórias para ativar o JavaMailSender)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

# Configuração do Destinatário e Gemini
app.mail.destinatario=${MAIL_DESTINO:sachabm@gmail.com}
gemini.api.key=${GEMINI_API_KEY}

logging.level.org.springframework.web=INFO