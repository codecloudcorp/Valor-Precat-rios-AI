spring.application.name=backend
server.port=${PORT:8080}
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

# GMAIL SMTP (SSL PURO - Porta 465)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# FORÇAR SSL E SOCKETS
spring.mail.protocol=smtps
spring.mail.properties.mail.transport.protocol=smtps
spring.mail.properties.mail.smtps.auth=true
spring.mail.properties.mail.smtps.starttls.enable=false
spring.mail.properties.mail.smtps.timeout=5000
spring.mail.properties.mail.smtps.connectiontimeout=5000

# API KEY GEMINI
gemini.api.key=${GEMINI_API_KEY}
app.mail.destinatario=${MAIL_DESTINO}