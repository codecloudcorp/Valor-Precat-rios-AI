spring.application.name=backend

# Configuração do Servidor
server.port=${PORT:8080}

# Origens permitidas (CORS)
cors.allowed.origins=http://localhost:3000,http://localhost:8080

# Configuração do Destinatário (Quem vai receber as notificações)
app.mail.destinatario=${MAIL_DESTINO:sachabm@gmail.com}

# Chave da API do Google Gemini
gemini.api.key=${GEMINI_API_KEY}

# Configurações de Log
logging.level.org.springframework.web=INFO

# Configurações de E-mail (Porta 465 SSL - Configuração Robusta)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp

# Propriedades de Handshake e Timeout
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.transport.protocol=smtp

# Adicione estas linhas para evitar que a conexão fique "pendurada"
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Força o uso de IPv4 (Muitas vezes o timeout ocorre tentando usar IPv6 no Railway)
spring.mail.properties.mail.smtp.localhost=127.0.0.1