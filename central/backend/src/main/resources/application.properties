spring.application.name=backend

# Configuração do Servidor
server.port=${PORT:8080}

# Origens permitidas (CORS) - Adicionei seus domínios reais
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://valorprecatorio.adv.br,https://valor-precat-rios-ai.vercel.app,http://localhost:3000}

# Chave da API (No Railway, coloque a API KEY do Resend em MAIL_PASSWORD)
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Configuração do Destinatário e Gemini
app.mail.destinatario=${MAIL_DESTINO:sachabm@gmail.com}
gemini.api.key=${GEMINI_API_KEY}
logging.level.org.springframework.web=INFO