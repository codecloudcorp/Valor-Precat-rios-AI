spring.application.name=backend

# Configuração do Servidor (NÃO MEXA, ISSO ESTÁ CERTO)
server.port=${PORT:8080}

# Lista de origens permitidas (separadas por vírgula, SEM ESPAÇOS e SEM BARRA NO FINAL)
cors.allowed.origins=http://localhost:3000,http://localhost:8080

# Chave da API do Google Gemini (Lê a variável GEMINI_API_KEY do Railway)
gemini.api.key=${GEMINI_API_KEY}

# Configurações de Log
logging.level.org.springframework.web=INFO

# Configurações do Servidor de E-mail (Modo SSL - Porta 465)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=JavaMailSender
spring.mail.properties.mail.smtp.auth=true

# MUDANÇA IMPORTANTE: Força o uso de SSL na porta 465
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com