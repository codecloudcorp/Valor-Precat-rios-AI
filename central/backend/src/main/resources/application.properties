spring.application.name=backend

# Configuração do Servidor
server.port=${PORT:8080}

# Origens permitidas (CORS)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# Configurações de E-mail (Migrado para API para evitar Timeout no Railway)
# MAIL_USERNAME: Seu e-mail (ex: sachabm@gmail.com)
# MAIL_PASSWORD: Sua API KEY do Resend (ex: re_123456)
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Configuração do Destinatário e Gemini
app.mail.destinatario=${MAIL_DESTINO:sachabm@gmail.com}
gemini.api.key=${GEMINI_API_KEY}
logging.level.org.springframework.web=INFO