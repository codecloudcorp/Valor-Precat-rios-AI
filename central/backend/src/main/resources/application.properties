spring.application.name=backend

# Configuração do Servidor
server.port=${PORT:8080}

# Origens permitidas (CORS) - Atualize com a URL do seu Vercel no Railway
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# Configuração do Destinatário
app.mail.destinatario=${MAIL_DESTINO:sachabm@gmail.com}

# Chave da API do Google Gemini
gemini.api.key=${GEMINI_API_KEY}

# Configurações de Log
logging.level.org.springframework.web=INFO

# Configurações de E-mail (Porta 587 TLS - Mais estável em Cloud)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp

# Propriedades de Handshake e Segurança
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Timeouts para evitar que a thread fique travada
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Força o uso de IPv4 e define localhost (Evita erros de rede comuns no Railway)
spring.mail.properties.mail.smtp.localhost=127.0.0.1