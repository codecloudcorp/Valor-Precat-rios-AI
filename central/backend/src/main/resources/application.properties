spring.application.name=backend
server.port=${PORT:8080}

# Origens permitidas (CORS) - Fundamental para resolver o "Failed to fetch"
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://valorprecatorio.adv.br,https://www.valorprecatorio.adv.br,https://valor-precat-rios-ai.vercel.app,http://localhost:3000}

# Configuração Gmail Segura (Porta 465 + SSL)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Timeouts para evitar travamento da thread
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

# Destinatário e Gemini
app.mail.destinatario=${MAIL_DESTINO:sachabm@gmail.com}
gemini.api.key=${GEMINI_API_KEY}